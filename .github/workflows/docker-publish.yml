name: "Release & Publish Docker Image"

on:
  push:
    tags:
      - 'v*'  # 当推送以 'v' 开头的 tag 时触发（例如: git push origin v1.1.2）
  workflow_dispatch: # 保留手动触发作为备份手段
    inputs:
      version:
        description: '手动指定版本号 (例如: v1.0.0)'
        required: true
        type: string

env:
  # 统一将镜像推送到 GitHub Container Registry
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 所需权限
      packages: write   # 推送镜像到 ghcr.io 所需权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        # 当通过 git tag 触发时，自动创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=true
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
